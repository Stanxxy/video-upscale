[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-analysis-core"
version = "0.3.0.post11"
description = "Portable BJJ position/technique inference contracts and normalization"
requires-python = ">=3.12"
dependencies = ["shared-lib>=1.16.0,<1.19", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bjj_analysis_core = ["prompts/*.txt", "prompts_mma/*.txt", "prompts_mma_strikes/*.txt", "prompts_mma_ground/*.txt", "prompts_mma_sequences/*.txt"]
