[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-analysis-core"
version = "0.3.0"
description = "Portable BJJ position/technique inference contracts and normalization"
requires-python = ">=3.12"
dependencies = ["shared-lib>=1.5.0,<1.6", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bjj_analysis_core = ["prompts/*.txt"]
