[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-vision-engine"
version = "0.0.1"
description = "Vision engine: hybrid BJJ tracking and analysis service"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracking", "tracking_pipeline"]
