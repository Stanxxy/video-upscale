openapi: 3.0.3
info:
  title: BJJ Video Analysis Service
  description: |
    REST API for the vision engine (Gemini highlight analysis).
    Consumed by `bjj-vision-backend` and QA tooling.

    **Live docs:** FastAPI serves interactive Swagger UI at `/docs` and ReDoc at `/redoc` when the service is running.

    **Streaming:** `GET /jobs/{job_id}/events` uses Server-Sent Events (`text/event-stream`), not WebSocket.
  version: 2.0.0
  contact:
    name: whole-video-analysis
servers:
  - url: http://localhost:9001
    description: Local default (see `service.sh` / AGENTS.md)
  - url: "{baseUrl}"
    description: Deployed engine base URL
    variables:
      baseUrl:
        default: https://engine.example.com

tags:
  - name: Jobs
    description: Create, query, and cancel analysis jobs
  - name: Streaming
    description: Server-Sent Events for job progress
  - name: System
    description: Health and diagnostics

paths:
  /track:
    post:
      tags: [Jobs]
      summary: Start a new analysis job
      description: |
        Creates a job, persists lifecycle + request to Keyspaces (when configured), and schedules asynchronous work.
        Returns immediately with `pending` status. An interrupted job resumes under the same `job_id` after an engine restart; there is no resume endpoint.
      operationId: createTrackJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackRequest"
      responses:
        "200":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "429":
          description: Server at capacity (`max_concurrent_jobs` semaphore exhausted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Server is at capacity. Try again later.
        "500":
          description: Failed to persist lifecycle or request to storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job/{job_id}:
    get:
      tags: [Jobs]
      summary: Get job status
      description: |
        Reads Keyspaces lifecycle first; falls back to in-memory job store if no lifecycle row exists.
        `status` is the Keyspaces `job_state` in lowercase (e.g. `running`, `completed`). A row left by the retired local tracking pipeline reads as `failed` with an explanatory `error_message`.
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Jobs]
      summary: Cancel a job
      description: |
        Marks the job cancelled, writes a cancellation checkpoint, cancels the local asyncio task if running.
        If the job row carries a `replacement_job_id` (historical rows only), returns 409 — cancel the latest job instead.
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "404":
          description: Job not found (no lifecycle and no in-memory job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job row has a replacement (historical rows only); cancel the replacement job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Persistence failure during cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{job_id}/events:
    get:
      tags: [Streaming]
      summary: Subscribe to job events (SSE)
      description: |
        **Server-Sent Events** stream reading the durable Keyspaces `job_lifecycle`
        projection approximately every second. Workers write lifecycle progress;
        clients never connect to the engine over WebSocket or poll for progress.

        Event types (JSON in `data:` unless noted):

        | `event` | When |
        |--------|------|
        | `progress` | State or progress changed (`percent` delta ≥ 0.5 or lifecycle state changed). Payload includes `type`, `state` (pipeline stage), `phase` (`stage_message`), `percent`, `frame_idx`, and `total_frames`; chunk/count/attribution fields are added when present. |
        | `completed` | Job reached `COMPLETED`. Stream ends. |
        | `job_error` | Job `FAILED` / `CANCELLED`, job not found, or repeated internal errors. Stream ends. |
        | `interrupted` | Job state is `INTERRUPTED`. Stream ends. |

        Comment lines `: keepalive` are sent periodically to avoid proxy idle timeouts.
      operationId: jobEventsSse
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: SSE stream
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE framing — parse `event:` and `data:` lines per HTML spec

  /health:
    get:
      tags: [System]
      summary: Liveness / readiness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Job identifier (UUID string)

  schemas:
    AnalyzerMode:
      type: string
      enum: [single, multi]

    TrackRequest:
      type: object
      required: [bucket, key]
      properties:
        bucket:
          type: string
          description: Source S3 bucket for input video
        key:
          type: string
          description: Source S3 object key
        output_bucket:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
          description: Populated when submitted via platform; optional for engine-direct jobs
        start_time:
          type: string
          nullable: true
          description: Clip start — MM:SS or HH:MM:SS
        end_time:
          type: string
          nullable: true
        video_id:
          type: string
          format: uuid
          nullable: true
        sampling_rate:
          type: integer
          minimum: 1
          default: 1
        analyzer_mode:
          $ref: "#/components/schemas/AnalyzerMode"
        sns_topic_arn:
          type: string
          nullable: true
        analysis_model:
          type: string
          nullable: true
        analysis_media_resolution:
          type: string
          nullable: true
        analysis_fps:
          type: integer
          nullable: true
        analysis_thinking:
          type: string
          nullable: true

    TrackResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          example: pending

    JobResponse:
      type: object
      required: [job_id, status, created_at, updated_at]
      properties:
        job_id:
          type: string
        status:
          type: string
          description: |
            Lowercase Keyspaces job lifecycle state. Typical values include
            `pending`, `running`, `interrupted`, `completed`, `failed`, `cancelled`.
        progress_percent:
          type: number
          format: float
          default: 0
        current_frame:
          type: integer
          nullable: true
        total_frames:
          type: integer
          nullable: true
        result_bucket:
          type: string
          nullable: true
        result_key:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          description: ISO-ish string from lifecycle `started_at`
        updated_at:
          type: string

    CancelJobResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          example: cancelled
        job_id:
          type: string

    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp

    ErrorResponse:
      type: object
      description: "FastAPI HTTPException body — typically `{ \"detail\": string | array }`"
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items: {}
