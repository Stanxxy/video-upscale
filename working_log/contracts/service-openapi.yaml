openapi: 3.0.3
info:
  title: BJJ Video Tracking & Analysis Service
  description: |
    REST API for the vision engine (hybrid tracking, upscaling, Gemini analysis).
    Consumed by `bjj-vision-backend` and QA tooling.

    **Live docs:** FastAPI serves interactive Swagger UI at `/docs` and ReDoc at `/redoc` when the service is running.

    **Streaming:** `GET /jobs/{job_id}/events` uses Server-Sent Events (`text/event-stream`), not WebSocket.
  version: 2.0.0
  contact:
    name: whole-video-analysis
servers:
  - url: http://localhost:9001
    description: Local default (see `service.sh` / AGENTS.md)
  - url: "{baseUrl}"
    description: Deployed engine base URL
    variables:
      baseUrl:
        default: https://engine.example.com

tags:
  - name: Jobs
    description: Create, query, cancel, and resume analysis jobs
  - name: Streaming
    description: Server-Sent Events for job progress
  - name: System
    description: Health and diagnostics

paths:
  /track:
    post:
      tags: [Jobs]
      summary: Start a new tracking / analysis job
      description: |
        Creates a job, persists lifecycle + request to Keyspaces (when configured), and schedules asynchronous work.
        Returns immediately with `pending` status.

        Use **only** for new jobs — not for human-in-the-loop resume (use `POST /jobs/{job_id}/detection_response` or `POST /jobs/{job_id}/resume`).
      operationId: createTrackJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackRequest"
      responses:
        "200":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "429":
          description: Server at capacity (`max_concurrent_jobs` semaphore exhausted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Server is at capacity. Try again later.
        "500":
          description: Failed to persist lifecycle or request to storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job/{job_id}:
    get:
      tags: [Jobs]
      summary: Get job status
      description: |
        Reads Keyspaces lifecycle first; falls back to in-memory job store if no lifecycle row exists.
        `status` is the Keyspaces `job_state` in lowercase (e.g. `running`, `completed`, `awaiting_correction`).
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Jobs]
      summary: Cancel a job
      description: |
        Marks the job cancelled, writes a cancellation checkpoint, cancels the local asyncio task if running.
        If the job was already replaced by a new job (`replacement_job_id`), returns 409 — cancel the latest job instead.
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "404":
          description: Job not found (no lifecycle and no in-memory job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job has a replacement; cancel the replacement job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Persistence failure during cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{job_id}/events:
    get:
      tags: [Streaming]
      summary: Subscribe to job events (SSE)
      description: |
        **Server-Sent Events** stream reading the durable Keyspaces `job_lifecycle`
        projection approximately every second. Workers write lifecycle progress;
        clients never connect to the engine over WebSocket or poll for progress.

        Event types (JSON in `data:` unless noted):

        | `event` | When |
        |--------|------|
        | `progress` | State or progress changed (`percent` delta ≥ 0.5 or lifecycle state changed). Payload includes `type`, `state` (pipeline stage), `phase` (`stage_message`), `percent`, `frame_idx`, and `total_frames`; highlight-v2 rows add chunk/count/attribution fields when present. |
        | `detection_needed` | Job state is `AWAITING_CORRECTION` and a checkpoint has `pending_detection`. |
        | `completed` | Job reached `COMPLETED`. Stream ends. |
        | `job_error` | Job `FAILED` / `CANCELLED`, job not found, or repeated internal errors. Stream ends. |
        | `interrupted` | Job state is `INTERRUPTED`. Stream ends. |

        Comment lines `: keepalive` are sent periodically to avoid proxy idle timeouts.
      operationId: jobEventsSse
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: SSE stream
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE framing — parse `event:` and `data:` lines per HTML spec

  /jobs/{job_id}/detection_response:
    post:
      tags: [Jobs]
      summary: Submit corrected bounding boxes (human-in-the-loop)
      description: |
        For jobs in `AWAITING_CORRECTION`. Creates a **new** job that continues the pipeline with verified boxes,
        links it as the replacement, and starts work. Returns the new `job_id`.
      operationId: submitDetectionResponse
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: Replacement job created and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeJobResponse"
        "404":
          description: Job or original request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wrong state, replacement already exists, or replacement claim failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{job_id}/resume:
    post:
      tags: [Jobs]
      summary: Resume with corrected boxes (alias)
      description: |
        Same behavior as `POST /jobs/{job_id}/detection_response`. Called by the analysis service
        `POST /checkpoints/{job_id}/correct` flow on the backend side.
      operationId: resumeJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: Replacement job created and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeJobResponse"
        "404":
          description: Job or original request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wrong state, replacement already exists, or replacement claim failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      tags: [System]
      summary: Liveness / readiness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Job identifier (UUID string)

  schemas:
    AnalyzerMode:
      type: string
      enum: [single, multi]

    TrackRequest:
      type: object
      required: [bucket, key]
      properties:
        bucket:
          type: string
          description: Source S3 bucket for input video
        key:
          type: string
          description: Source S3 object key
        output_bucket:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
          description: Populated when submitted via platform; optional for engine-direct jobs
        sam2_model:
          type: string
          default: facebook/sam2.1-hiera-base-plus
        processing_mode:
          type: string
          enum:
            - standard
            - fast
          default: standard
          description: >
            Controls pipeline quality/speed tradeoff.
            "standard" (default): SAM2 base-plus, Real-ESRGAN upscale, full Gemini context chain.
            "fast": SAM2-tiny, bicubic upscale, high-fanout Gemini (no context chain). Accuracy ≥ 80% of standard.
        detection_threshold:
          type: number
          format: float
          default: 0.5
        yolo_model:
          type: string
          default: yolo26m
        start_time:
          type: string
          nullable: true
          description: Clip start — MM:SS or HH:MM:SS
        end_time:
          type: string
          nullable: true
        box_a:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          nullable: true
          description: "[x1, y1, x2, y2] xyxy — skips detection if provided with box_b"
        box_b:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          nullable: true
        step_size:
          type: integer
          nullable: true
        max_history:
          type: integer
          nullable: true
        max_missing_frames:
          type: integer
          nullable: true
        skip_upscale:
          type: boolean
          default: false
        video_id:
          type: string
          format: uuid
          nullable: true
        sampling_rate:
          type: integer
          minimum: 1
          default: 1
        analyzer_mode:
          $ref: "#/components/schemas/AnalyzerMode"
        method:
          type: string
          default: esrgan
        sns_topic_arn:
          type: string
          nullable: true
        player_references:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          nullable: true
        resume_from_job_id:
          type: string
          nullable: true
          description: Load checkpoints from this job in Keyspaces
        resume_tracking_s3_key:
          type: string
          nullable: true
        resume_from_frame:
          type: integer
          nullable: true
        analysis_raw_s3_key:
          type: string
          nullable: true
        analysis_window_count:
          type: integer
          nullable: true
        analysis_current_context:
          type: string
          nullable: true
        resume_existing_upload_tracking_key:
          type: string
          nullable: true
        resume_existing_upload_analysis_key:
          type: string
          nullable: true
        resume_existing_upload_annotated_key:
          type: string
          nullable: true
        resume_terminal_publish_done:
          type: boolean
          default: false

    ResumeRequest:
      type: object
      required: [box_a, box_b]
      properties:
        box_a:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: Athlete A bounding box [x1, y1, x2, y2] xyxy
        box_b:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: Athlete B bounding box [x1, y1, x2, y2] xyxy
        player_mapping:
          type: object
          additionalProperties:
            type: string
          nullable: true

    TrackResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          example: pending

    JobResponse:
      type: object
      required: [job_id, status, created_at, updated_at]
      properties:
        job_id:
          type: string
        status:
          type: string
          description: |
            Lowercase Keyspaces job lifecycle state. Typical values include
            `pending`, `running`, `awaiting_correction`, `interrupted`, `completed`, `failed`, `cancelled`.
        progress_percent:
          type: number
          format: float
          default: 0
        current_frame:
          type: integer
          nullable: true
        total_frames:
          type: integer
          nullable: true
        result_bucket:
          type: string
          nullable: true
        result_key:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          description: ISO-ish string from lifecycle `started_at`
        updated_at:
          type: string

    CancelJobResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          example: cancelled
        job_id:
          type: string

    ResumeJobResponse:
      type: object
      required: [status, job_id, origin_job_id]
      properties:
        status:
          type: string
          example: resumed
        job_id:
          type: string
          description: New replacement job ID
        origin_job_id:
          type: string
          description: Prior job that was awaiting correction

    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp

    ErrorResponse:
      type: object
      description: "FastAPI HTTPException body — typically `{ \"detail\": string | array }`"
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items: {}
