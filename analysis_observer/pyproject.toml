[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-analysis-observer"
version = "0.1.0.post3"
description = "Read-only durable BJJ analysis observation for account and session hosts"
requires-python = ">=3.12"
dependencies = [
    "bjj-analysis-core==0.3.0.post4",
    "shared-lib>=1.10.0,<1.13",
    "pydantic>=2.10,<3",
    "cassandra-driver>=3.29.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
